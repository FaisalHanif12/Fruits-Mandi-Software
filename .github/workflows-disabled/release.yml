# Release: every merge to main that changes app files (Release_Pipeline.md sections 1 and 2).
# Tests the merged commit again (CI and Windows), then builds, signs and publishes vX.Y.N
# with latest.json for the in-app updater. The app installs only when the Owner agrees (NFR-INS-3).
name: Release

on:
  push:
    branches: [main]
    # A merge that changes only these paths makes no release.
    # Example: fixing a typo in the PRD does not ask the Owner to update.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.github/**'
      - '**/*.md'
  # Re-run a release from the Actions tab. It gets a new run number, so a new version.
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in merge order. Never cancel a release half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows
    uses: ./.github/workflows/windows.yml

  publish:
    name: Build, sign and publish
    needs: [ci, windows]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Check the updater signing key is set
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set. See Release_Pipeline.md 3.1 and 3.2."
            exit 1
          fi

      # The Owner sees this text as "what's new" (Urdu first, then English).
      # tech-lead updates it on the feature branch before merging (CLAUDE.md, Git).
      - name: Read the release notes
        id: notes
        run: |
          f=docs/release/whats-new.md
          if [ ! -s "$f" ]; then
            echo "::error file=$f::Release notes are missing or empty. Add $f (Urdu, then English) and merge again."
            exit 1
          fi
          delim="WHATS_NEW_$(date +%s%N)"
          {
            echo "body<<$delim"
            cat "$f"
            echo
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Set up pnpm, Node and Rust
        uses: ./.github/actions/setup

      # Version = major.minor from tauri.conf.json + this Release run number.
      # Example: the file says 0.1.0 and this is run 12, so the app becomes 0.1.12.
      # The change is made only on the runner. It is never committed.
      - name: Set the version
        id: version
        run: |
          node <<'EOF'
          const fs = require('fs');
          const file = 'backend/app/tauri.conf.json';
          const conf = JSON.parse(fs.readFileSync(file, 'utf8'));
          const m = /^(\d+)\.(\d+)\.\d+$/.exec(String(conf.version ?? ''));
          if (!m) {
            console.log(`::error file=${file}::"version" must look like 0.1.0. Found "${conf.version}".`);
            process.exit(1);
          }
          conf.version = `${m[1]}.${m[2]}.${process.env.GITHUB_RUN_NUMBER}`;
          fs.writeFileSync(file, JSON.stringify(conf, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${conf.version}\n`);
          console.log(`Release version: ${conf.version}`);
          EOF

      # Windows code signing. Turn on when the certificate is bought (Tech Stack 7,
      # Release_Pipeline.md 3.2): add the two secrets, uncomment this step, and set
      # bundle.windows.certificateThumbprint, digestAlgorithm and timestampUrl in tauri.conf.json.
      # - name: Import the Windows code-signing certificate
      #   shell: pwsh
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #   run: |
      #     $pfx = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
      #     $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
      #     Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
      #     Remove-Item $pfx

      # Builds NSIS and MSI, signs the updater files, and uploads everything plus
      # latest.json to a draft release. The draft is published in the next step.
      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Mandi Software v${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          # The app updates with the NSIS setup file (Tech Stack 7).
          updaterJsonPreferNsis: true
          retryAttempts: 1

      # Publish only after every file, including latest.json, is uploaded.
      # Until then the app keeps seeing the previous release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee assets.txt
          for want in 'latest.json' '-setup.exe' '-setup.exe.sig' '.msi'; do
            if ! grep -q -- "$want" assets.txt; then
              echo "::error::Release $TAG is missing a file ending in '$want'. Not publishing."
              exit 1
            fi
          done
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG"

      # The installed app reads exactly this URL (tauri.conf.json plugins.updater.endpoints).
      # Prove it serves the new version, signed, pointing at the NSIS setup file.
      - name: Check the published update file
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$url" -o latest.json; then break; fi
            echo "Not served yet, waiting 10 seconds"; sleep 10
          done
          node <<'EOF'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          const p = (j.platforms || {})['windows-x86_64'];
          const fail = (m) => { console.log(`::error::latest.json: ${m}`); process.exit(1); };
          if (j.version !== process.env.VERSION) fail(`version is ${j.version}, expected ${process.env.VERSION}`);
          if (!p) fail('no windows-x86_64 entry');
          if (!p.signature || p.signature.length < 100) fail('signature is missing');
          if (!/-setup\.exe$/.test(p.url)) fail(`url is not the NSIS setup file: ${p.url}`);
          console.log(`latest.json OK: version ${j.version}, ${p.url}, signature ${p.signature.length} characters`);
          EOF
