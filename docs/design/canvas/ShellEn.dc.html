<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gulzar&amp;family=Inter:wght@400;500;600;700&amp;display=block">
<style>
body{margin:0;background:#F6F4EF;color:#1C1F23;font-family:Inter,system-ui,sans-serif}
a{color:#1D3D6E}a:hover{color:#132A4D}
.ur{font-family:Gulzar,serif;line-height:1.9}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.kbd{display:inline-flex;align-items:center;height:22px;padding:0 6px;border-radius:4px;font:600 12px/1 Inter,sans-serif}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:8px;color:#D6DDE8;font-size:15px;font-weight:500;text-decoration:none}

</style>
</helmet>
<div dir="ltr" style="width:1366px;height:768px;display:flex;flex-direction:column;background:#F6F4EF">
  <div style="flex:1;display:flex;min-height:0">
    <nav aria-label="Main menu" style="width:224px;background:#16263F;display:flex;flex-direction:column;padding:16px 12px;gap:4px;box-sizing:border-box">
      <div style="font-size:16px;font-weight:700;color:#FFFFFF;padding:10px 14px 16px;letter-spacing:.02em">Mandi Software</div>
      <a class="nav" href="#" aria-current="page" style="background:#24406B;color:#FFFFFF"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Dashboard</a>

      <a class="nav" href="#"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h13l5 5v5H3z"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>Sale</a>
      <a class="nav" href="#"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="3"></circle></svg>Cash Book</a>
      <a class="nav" href="#"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 20c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.5 6 4"></path></svg>Partners</a>

      <a class="nav" href="#"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"></path><path d="M12 12v6M9 15l3 3 3-3"></path></svg>Backup</a>
      <a class="nav" href="#"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>Settings</a>

    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <header style="height:60px;background:#FFFFFF;border-bottom:1px solid #D9D4C9;display:flex;align-items:center;gap:16px;padding:0 24px">
        <label style="flex:1;max-width:520px;display:flex;align-items:center;gap:10px;height:40px;border:1px solid #8C8577;border-radius:8px;padding:0 12px;background:#F6F4EF">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#565C64" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
          <input aria-label="Search" placeholder="Search code, name, sale number or truck" style="flex:1;border:0;background:transparent;font:15px Inter,sans-serif;outline:none">
          <span class="kbd" style="background:#EFECE5;color:#1C1F23">Ctrl+K</span>
        </label>
        <div style="flex:1"></div>
        <button aria-label="Needs attention, nothing now" style="width:40px;height:40px;border:1px solid #D9D4C9;border-radius:8px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1F23" stroke-width="2" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></button>
        <div role="group" aria-label="Language" style="display:inline-flex;border:1px solid #8C8577;border-radius:8px;overflow:hidden;height:40px">
          <button class="ur" style="border:0;background:#FFFFFF;color:#1C1F23;padding:0 12px;font-size:18px" aria-pressed="false">اردو</button>
          <button style="border:0;background:#1D3D6E;color:#FFFFFF;padding:0 12px;font:500 14px Inter,sans-serif" aria-pressed="true">English</button>
        </div>
        <button style="height:40px;display:flex;align-items:center;gap:8px;border:1px solid #D9D4C9;border-radius:8px;background:#FFFFFF;padding:0 10px;font:500 14px Inter,sans-serif"><span style="width:28px;height:28px;border-radius:14px;background:#1D3D6E;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">O</span>Owner</button>
      </header>
      <main style="flex:1;padding:32px;display:flex;flex-direction:column;gap:24px;overflow:hidden">
        <div>
          <div style="font-size:28px;font-weight:700">Good morning, Owner</div>
          <div style="font-size:15px;color:#565C64">Saturday, <span class="num">10-10-2026</span> · Day is open</div>
        </div>
        <div style="flex:1;display:flex;align-items:center;justify-content:center">
          <div style="width:560px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
            <div style="width:72px;height:72px;border-radius:36px;background:#E6ECF5;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1D3D6E" stroke-width="1.8" aria-hidden="true"><path d="M3 7h13l5 5v5H3z"></path><circle cx="7" cy="18" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg></div>
            <div style="font-size:22px;font-weight:700">No sales yet today</div>
            <div style="font-size:15px;color:#565C64">First add sellers and buyers in the Index, then enter the first sale.</div>
            <div style="display:flex;gap:10px;margin-top:6px">
              <button style="height:44px;padding:0 18px;border:0;border-radius:8px;background:#1D3D6E;color:#FFFFFF;font:600 15px Inter,sans-serif">Open Index</button>
              <button style="height:44px;padding:0 16px;border:1px solid #8C8577;border-radius:8px;background:#FFFFFF;display:inline-flex;align-items:center;gap:10px;font:600 15px Inter,sans-serif">New sale<span class="kbd" style="background:#EFECE5;color:#1C1F23">Alt+B</span></button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <footer style="height:32px;background:#EFECE5;border-top:1px solid #D9D4C9;display:flex;align-items:center;gap:24px;padding:0 16px;font-size:13px">
    <span>User: Owner</span>
    <span>Date: <span class="num">10-10-2026</span></span>
    <span style="display:inline-flex;align-items:center;gap:6px;color:#17703F;font-weight:600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#17703F" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Day open</span>
    <span style="flex:1"></span>
    <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:4px;background:#8C8577"></span>Cloud backup: not set up yet</span>
  </footer>
</div>
</x-dc>
