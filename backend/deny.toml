# cargo-deny policy (Code Standards G10, S6; plan 01 T1.9).
# Run from backend/: cargo deny check

[graph]
# The app ships on Windows and is built on a Mac for development.
# Linux-only crates (GTK and friends) are not part of what we ship.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[advisories]
version = 2
# Known vulnerabilities and unsound crates always fail (S6).
unsound = "all"
yanked = "deny"
# Unmaintained crates fail anywhere in the tree. None today (10-10-2026).
unmaintained = "all"
# One targeted exception, and nothing else is relaxed (`yanked` stays "deny").
# zip 4.6.1: yanked on crates.io, and so is every other 4.x release, so no lock update can
# fix it. It is reached only through tauri-plugin-updater (2.13.2 and the newer 2.14.0 both
# need zip 4), on Windows, to unpack legacy `.zip` update bundles. It also has three advisories
# on `extract()` (RUSTSEC-2026-0367, -0368, -0369, found 17-10-2026). The updater unpacks an
# update only after its signature check, so an attacker-made archive is not reached.
# Before go-live: move to an updater release that uses a newer zip (the updater 3.x line is
# still alpha on 16-10-2026), or build the updater without its `zip` feature, since our
# release pipeline publishes the installer itself (`createUpdaterArtifacts: true`).
ignore = [
    # Run B, plan 18: age (the backup encryption the Tech Stack names) pulls i18n-embed-fl, which
    # reads its own message files at build time with basic-toml. Unmaintained, no vulnerability,
    # build time only (a proc macro), never in the running app's code path. Remove when age moves
    # off it or the lead picks another encryption crate.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained (no vulnerability); build-time only through age -> i18n-embed-fl" },
    { crate = "zip@4.6.1", reason = "yanked; only through tauri-plugin-updater; upgrade the updater before go-live" },
    { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 comes only through tauri-plugin-updater, which unpacks an update only after its signature check; remove before go-live by moving the updater off zip 4" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 comes only through tauri-plugin-updater, which unpacks an update only after its signature check; remove before go-live by moving the updater off zip 4" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 comes only through tauri-plugin-updater, which unpacks an update only after its signature check; remove before go-live by moving the updater off zip 4" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# BSD-2-Clause and BSL-1.0 are on the plan 01 list but no crate uses them yet.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]

[licenses.private]
# Our own crates are not published and carry no licence field.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between our own (unpublished) crates are allowed.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
