# Mandi Software Rust workspace (Tech Stack 5.4).
# Dependency direction, never the other way (CLAUDE.md rule 6, Code Standards B1):
#   app -> services, reports, backup
#   services -> domain, db
#   reports -> db, core
#   backup -> db, core
#   domain -> core
#   db -> core
# The test app/tests/workspace_rules.rs checks this list.

[workspace]
resolver = "3"
members = [
    "app",
    "crates/core",
    "crates/domain",
    "crates/db",
    "crates/services",
    "crates/reports",
    "crates/backup",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Our crates
mandi-core = { path = "crates/core" }
mandi-domain = { path = "crates/domain" }
mandi-db = { path = "crates/db" }
mandi-services = { path = "crates/services" }
mandi-reports = { path = "crates/reports" }
mandi-backup = { path = "crates/backup" }

# Tauri 2 and the five plugins of Tech Stack 2. No other plugin.
tauri = { version = "2.12.2", features = [] }
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.13.2"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-process = "2.4.0"

# Serialisation, errors, TypeScript types, dates
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ts-rs = "12.0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Core text and tests (Tech Stack 2): NFC for names and search keys, Urdu sort
# order (ICU4X, Unicode-3.0 licence, compiled data built in), property tests.
unicode-normalization = "0.1.25"
icu_collator = "2.3.1"
icu_locale_core = "2.3.0"
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }

# Database (Tech Stack 2): SQLite built in, with the online backup API and custom collations.
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "collation"] }
rusqlite_migration = "2.6.0"
# Hash chain over audit entries (NFR-SEC-6). Plan 03 4.5.
blake3 = "1.8.7"
# Key store for the audit chain key: Windows Credential Manager, macOS keychain in development.
keyring = "4.2.0"
# Logging (NFR-OBS-1). Daily files, our own clean-up.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt"] }
tracing-appender = "0.2.5"
# Passwords: Argon2id (Tech Stack 2, plan 04). We give the salt ourselves, so no random feature.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "password-hash"] }
# Close spellings in the picker search (Tech Stack 2, plan 06): Damerau-Levenshtein style distance.
strsim = "0.11.1"
# Plan 03 4.2c, approved by tech-lead: random audit key, free disk space, temp folders in tests.
getrandom = "0.4.3"
fs4 = "1.1.0"
tempfile = "3.27.0"

# Snapshot tests of print data and reports (Tech Stack 2, plan 14). A dev-dependency only; JSON
# snapshots of serde values, no console colours.
insta = { version = "1.49.0", default-features = false, features = ["json"] }

# Benchmarks for the NFR speed targets (Code Standards B25). No HTML or plot output.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

# Backup (Tech Stack 2, plan 18, run B). age encrypts, zstd compresses, object_store talks S3
# (Cloudflare R2). zstd stays on the 0.13 line the tree already has (one libzstd, `links`).
# tokio is only what object_store needs: a small runtime to call its async API from a worker thread.
age = "0.12.1"
zstd = "0.13.3"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
tokio = { version = "1.53.2", default-features = false, features = ["rt"] }

# Excel export and the readable pack (Tech Stack 2, plan 22 round 10, D5-Q1). rust_xlsxwriter
# writes the sheets; fluent-bundle gives them the same words as the screens, from the same
# .ftl files embedded at build time. Money reaches a sheet only through rupees_as_f64 (M13).
rust_xlsxwriter = "0.99.1"
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
# Test only: reads the sheets the export wrote, to check every number (MIT, already in the tree
# as the library under rust_xlsxwriter). No xlsx reader is part of the app.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Code Standards B8, G4. "forbid", so no #[allow(...)] can switch them off in
# real code. clippy.toml still allows them inside tests.
[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
indexing_slicing = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
print_stdout = "forbid"
print_stderr = "forbid"

# The password hash is memory-hard and slow without optimisation. Build it optimised even in
# debug builds, so tests and `pnpm dev` stay fast (login takes about 60 ms, not 2 s).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# The backup key is stretched with scrypt on every encrypted copy and every restore. Optimised, a
# copy in a test takes milliseconds, not a second.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
# The transliteration engine trains on 4,500 word pairs on first use and searches many
# spellings per key press. Unoptimised it is about 30 times slower, which makes tests crawl.
[profile.dev.package.mandi-core]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
